[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physcensis-reproduction"
version = "0.1.0"
description = "Clean-room reproduction of PhyScensis physical scene arrangement"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "PhyScensis reproduction contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "scipy>=1.12",
  "shapely>=2.0",
]

[project.urls]
Homepage = "https://github.com/Zarad0X/physcensis-reproduction"
Repository = "https://github.com/Zarad0X/physcensis-reproduction"
Issues = "https://github.com/Zarad0X/physcensis-reproduction/issues"

[project.optional-dependencies]
genesis = ["genesis-world>=0.3"]
render = ["matplotlib>=3.8", "pillow>=10.0", "trimesh>=4.0"]
agent = ["openai>=1.100"]
demo = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[project.scripts]
physcensis = "physcensis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
physcensis = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
